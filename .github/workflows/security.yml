name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *" # diário: vulnerabilidades novas aparecem sem mudar o código

permissions:
  contents: read

jobs:
  dependencies:
    name: Vulnerabilidades em dependências (pip-audit)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Auditar o lockfile (com hashes)
        shell: bash
        run: |
          uv python install 3.13
          uv sync --locked
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements-audit.txt
          # Exceções ativas (justificativa e prazo em SECURITY.md):
          #   GHSA-qp9x-wp8f-qgjj (tuf 4.0, delegações) — revisar até 2026-12-31
          uv run --locked pip-audit --strict --progress-spinner off --require-hashes --disable-pip             --ignore-vuln GHSA-qp9x-wp8f-qgjj -r requirements-audit.txt

  sast:
    name: Análise estática (Bandit)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: |
          uv python install 3.13
          uv sync --locked
          uv run --locked bandit -c pyproject.toml -r src

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (versão fixa, checksum conferido)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Varrer todo o histórico
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          queries: security-extended
      # Repositório privado sem "code scanning" (recurso pago): a análise roda sem enviar
      # resultados e o passo seguinte reprova o build se houver qualquer achado.
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          upload: never
          output: codeql-results
      - name: Reprovar se o CodeQL encontrou problemas
        run: |
          count=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
          echo "Achados do CodeQL: $count"
          test "$count" -eq 0
