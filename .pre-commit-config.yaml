# Ganchos executados antes de cada commit: `uv run pre-commit install`
# ruff e mypy rodam pelo uv, com as mesmas versões travadas no uv.lock.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-real-data
        name: bloquear bancos/backups/cofres no commit
        entry: arquivos de dados do app nunca vão para o repositório
        language: fail
        files: '(\.db|\.db-wal|\.db-shm|\.bkp|vault\.json)$'
