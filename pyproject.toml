[project]
name = "appfin"
version = "0.1.0"
description = "Gestão financeira do consultório odontológico — app desktop seguro (local-first, cifrado)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
# Dependências de execução: só o necessário para a fase atual (YAGNI).
# Novas dependências exigem justificativa (skill `security`, §10).
dependencies = [
    "pyside6-essentials==6.12.0",  # interface Qt (QtCharts/addons entram na fase 1)
    "pynacl==1.6.2",               # libsodium: Argon2id, XChaCha20-Poly1305
    "cryptography==50.0.2",        # HKDF
    "sqlcipher3==0.6.4",           # SQLite cifrado (SQLCipher 4.x)
    "zxcvbn==4.5.0",               # medidor de força da senha mestra
    "tufup==0.10.0",               # atualizações assinadas (TUF)
]

[project.scripts]
appfin = "appfin.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-qt==4.5.0",
    "pytest-cov==7.0.0",
    "hypothesis==6.140.2",
    "ruff==0.14.3",
    "mypy==1.18.2",
    "pip-audit==2.9.0",
    "bandit==1.8.6",
    "pre-commit==4.3.0",
    "argon2-cffi==25.1.0",          # só nos testes: 2ª implementação para conferir o Argon2id
    "pyinstaller==6.22.3",          # empacotamento (onedir)
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appfin"]

[tool.uv]
# Higiene de cadeia de suprimentos: ignora versões publicadas há menos de ~2 semanas
# (pacotes maliciosos recém-publicados costumam ser removidos nesse intervalo).
# Atualize esta data conscientemente ao subir dependências.
exclude-newer = "2026-10-19T00:00:00Z"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF",
    "S",      # regras de segurança (Bandit)
    "BLE",    # except Exception amplo
    "T20",    # print esquecido
    "PTH",    # pathlib
    "DTZ",    # datetime sem fuso
    "PIE", "RET", "ARG", "ERA",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["appfin", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002"]
"packaging/**" = ["T201"]  # scripts de linha de comando

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["appfin"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sqlcipher3.*", "zxcvbn.*", "nacl.*", "tufup.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
qt_api = "pyside6"
markers = [
    "slow: testes lentos (ex.: Argon2id com parâmetros de produção)",
]
filterwarnings = [
    "error",
    # tufup (lado do build) ainda usa datetime.utcnow(); não afeta a verificação no cliente.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:tufup.*",
]

[tool.coverage.run]
source = ["appfin"]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
